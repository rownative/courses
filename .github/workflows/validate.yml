name: Validate courses

on:
  pull_request:
    paths:
      - "courses/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read
  pull-requests: write  # required to post validation comment on PR

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history so base..head diff and HEAD^ fallback work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      - name: Get changed course files
        id: changed
        run: |
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD^ HEAD)
          COURSE_FILES=$(echo "$FILES" | grep -E '^courses/[^.].*\.json$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$COURSE_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate courses
        id: validate
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          FAILED=0
          PREEXISTING=0
          OUTPUT=""
          if [ -z "$FILES" ]; then
            echo "No course files changed."
            echo "result=ok" >> $GITHUB_OUTPUT
            exit 0
          fi
          for f in $FILES; do
            if [ -f "$f" ]; then
              # Capture into a variable rather than piping through tee: a pipeline's exit
              # status is tee's, so the old form could never fail.
              if LOG=$(python scripts/validate_course.py "$f" 2>&1); then
                OUTPUT="${OUTPUT}\n- \`$f\`: OK"
              else
                ERR=$(echo "$LOG" | grep -v 'warning:' | head -n 1 | sed "s|^$f: ||")
                # A file that already failed on the base branch is reported but does not
                # fail the job, so legacy geometry problems do not block unrelated edits.
                if [ -n "$BASE_SHA" ] && git show "$BASE_SHA:$f" > /tmp/base_course.json 2>/dev/null \
                   && ! python scripts/validate_course.py /tmp/base_course.json > /dev/null 2>&1; then
                  OUTPUT="${OUTPUT}\n- \`$f\`: ⚠️ FAILED, but already failing on base (not counted) — ${ERR}"
                  PREEXISTING=1
                else
                  OUTPUT="${OUTPUT}\n- \`$f\`: ❌ FAILED — ${ERR}"
                  FAILED=1
                fi
              fi
              echo "$LOG" | tee -a /tmp/validate.log
              while IFS= read -r w; do
                [ -n "$w" ] && OUTPUT="${OUTPUT}\n  - ⚠️ ${w#*warning: }"
              done <<< "$(echo "$LOG" | grep 'warning:' || true)"
            fi
          done
          if [ $PREEXISTING -ne 0 ]; then
            OUTPUT="${OUTPUT}\n\nSome files fail for reasons already present on the base branch; run \`python scripts/audit_courses.py\` for the full list."
          fi
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo -e "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "result=$([ $FAILED -eq 0 ] && echo ok || echo failed)" >> $GITHUB_OUTPUT
          if [ $FAILED -ne 0 ]; then
            echo "Validation failed. See log:"
            cat /tmp/validate.log
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = ${{ toJSON(steps.validate.outputs.output) }} || 'No courses changed';
            const result = ${{ toJSON(steps.validate.outputs.result) }} || 'ok';
            const body = `## Course validation\n\n${output}\n\n**Result:** ${result === 'ok' ? '✅ All passed' : '❌ Failed'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
